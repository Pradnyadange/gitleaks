name: Keep-Alive Ping (Supabase)

on:
  schedule:
    # Runs every 3 days at 06:00 UTC (well within the 7-day pause window)
    - cron: '0 6 */3 * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Health Check
        run: |
          curl -s -f "https://nsuzfpalpphomorfchub.supabase.co/auth/v1/health" || echo "Ping dispatched"

